name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Matches docker-compose.yml (postgres:16, user/pass leaflog, db leaf_log_dev).
  # Integration tests (incl. the friends-only privacy matrix) require this — without
  # DATABASE_URL they auto-skip, which would be a false green. CI must NOT skip them.
  DATABASE_URL: "postgresql://leaflog:leaflog@localhost:5437/leaf_log_dev?schema=public"
  AUTH_SECRET: "ci-auth-secret-at-least-32-characters-long-000000"
  AUTH_TRUST_HOST: "true"

jobs:
  gates:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: leaflog
          POSTGRES_PASSWORD: leaflog
          POSTGRES_DB: leaf_log_dev
        ports:
          - 5437:5432
        options: >-
          --health-cmd "pg_isready -U leaflog -d leaf_log_dev"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma migrate deploy
      # No curated seed data (sites are fully community-driven) — kept as the
      # entry point in case future non-site seed data is ever needed.
      - run: pnpm db:seed
      - run: pnpm typecheck
      - run: pnpm lint
      # Guard against a false green: assert the DB-backed privacy suite actually
      # runs (does not skip) before trusting the matrix.
      - name: Test (privacy matrix must run, not skip)
        run: pnpm test
      - run: pnpm build

  e2e:
    name: e2e (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: leaflog
          POSTGRES_PASSWORD: leaflog
          POSTGRES_DB: leaf_log_dev
        ports:
          - 5437:5432
        options: >-
          --health-cmd "pg_isready -U leaflog -d leaf_log_dev"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma migrate deploy
      # No curated seed data (sites are fully community-driven) — kept as the
      # entry point in case future non-site seed data is ever needed.
      - run: pnpm db:seed
      - run: pnpm exec playwright install --with-deps chromium
      # `pnpm e2e` generates the IGC fixture and starts its own dev server
      # (playwright webServer). The dev magic-link is written to /tmp.
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
