name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Matches docker-compose.yml (postgres:16, user/pass leaflog, db leaf_log_dev).
  # The unit/integration suite fails setup without a local DATABASE_URL.
  # Each suite migrates and cleans up its own temporary schema.
  DATABASE_URL: "postgresql://leaflog:leaflog@localhost:5437/leaf_log_dev?schema=public"
  AUTH_SECRET: "ci-auth-secret-at-least-32-characters-long-000000"
  AUTH_TRUST_HOST: "true"

jobs:
  gates:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: leaflog
          POSTGRES_PASSWORD: leaflog
          POSTGRES_DB: leaf_log_dev
        ports:
          - 5437:5432
        options: >-
          --health-cmd "pg_isready -U leaflog -d leaf_log_dev"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Same checks as the local pre-PR command. Tests migrate their own schema.
      - run: pnpm check:gates
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-report
          path: test-results/vitest.xml
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    name: e2e (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: leaflog
          POSTGRES_PASSWORD: leaflog
          POSTGRES_DB: leaf_log_dev
        ports:
          - 5437:5432
        options: >-
          --health-cmd "pg_isready -U leaflog -d leaf_log_dev"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # `pnpm e2e` builds and starts an isolated production server, without HMR.
      # The IGC fixture and local magic-link fallback need no external services.
      - run: pnpm check:e2e
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
