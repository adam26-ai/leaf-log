# Device HTTP ingress proxy — run on any host that can bind :80 and serve plain
# HTTP (a small VPS / Docker host). NOT Railway (it forces HTTPS). See README.md.
services:
  http-ingress:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
